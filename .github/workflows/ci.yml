name: CI and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ufc-bet-synthesiser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

      - name: Run critical browser journey
        run: npm run test:e2e

      - name: Build Worker and client
        run: npm run build

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export pre-migration D1 backup
        run: npx wrangler d1 export ufc-bet-synthesiser --remote --output pre-migration-backup.sql

      - name: Retain pre-migration backup
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-before-${{ github.sha }}
          path: pre-migration-backup.sql
          retention-days: 7

      - name: Apply production migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker and static assets
        run: npm run deploy

      - name: Smoke check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --silent --show-error "$PRODUCTION_URL/health"

      - name: Authenticated data smoke check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          curl --fail --silent --show-error
          -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID"
          -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET"
          "$PRODUCTION_URL/api/status"
